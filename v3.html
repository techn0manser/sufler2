const DEF=`#Титульный|0
Несколько лет назад мы собрали гидравлическую кисть, усилие которой было сопоставимо с усилием человеческой руки. Вот только её компоненты не получалось эргономично уместить в анатомических габаритах.
Меня зовут Евгений, я генеральный директор компании Биосинт.
И сегодня я расскажу, как мы приблизились к модульной гидравлике.
#Проблема: робототехника|21
Разработчики робототехнических систем сталкиваются с одним и тем же препятствием. Им нужен компактный и легкий привод с высоким усилием.
Гидравлика обладает необходимым усилием, но требует много места для размещения.
Мощные электроприводы слишком большие и тяжелые, а компактные – слабые.
#Решение: МСМ|35
Решением этой проблемы я представляю первый шаг к персонализированной гидравлике — Микрогидравлический силовой модуль.
Он включает компактный привод с интегрированной гидросистемой в едином корпусе и датчик положения штока.
При весе как у смартфона – 300 грамм, развивает усилие до шестидесяти пяти килограмм-сил.
Данное решение закрывает нишу между электроприводами и классической гидравликой в формфакторе сервопривода.
#Проблема: испытательные участки|58
Есть и вторая проблема.
На испытательных участках композитных труб оператор вынужден подходить к изделию под давлением 300 бар и вручную считывать показания микрометров.
#Решение: ЛУЧ-1|69
Для них мы предлагаем безопасный способ собирать и анализировать информацию осевого и диаметрального смещения посредством датчика линейного перемещения Луч-1. Он представляет компактную альтернативу устоявшимся на рынке сенсорам.
#Технология|81
Устройство МСМ одновременно простое и элегантное. Мы упаковали гидроцилиндр, распределитель, гидробак, датчик положения штока и микроконтроллер в одном корпусе.
Управление может происходить по блютуз, либо по проводному соединению. Питание возможно от аккумуляторного блока, либо от сети.
Гидронасос подключается отдельно, что дает возможность адаптировать разработанное устройство под разные задачи, в зависимости от необходимого усилия.
Для применения в системах экскаватора или бионического протеза руки, достаточно подобрать модуль с необходимым диаметром поршня и ходом штока.
А бесконтактный датчик линейного положения – Луч-1, позволяет отслеживать перемещение штока с точностью одной сотой миллиметра.
#Рынок МСМ|133
Первым на рынок выводим Луч-1 для применения в производствах с гидроиспытаниями и лабораториях. Следующий продукт МСМ, открывающий большой рынок робототехники и медицины.
Мы посчитали рынок МСМ в пяти сегментах и оставили только те устройства, где действительно нужна гидравлика. К тридцать третьему году этот рынок вырастет до тринадцати и восьми миллиарда рублей.
#TAM → SAM → SOM|146
В двадцать седьмом году начинаем с пилотов в робототехнике. А к тридцать третьему планируем занять 15% рынка, это два и один миллиарда рублей продаж.
#Конкуренты|159
При одинаковом усилии, МСМ в 5 раз компактнее и в 3,5 раза легче промышленного электропривода.
#Габариты в одном масштабе|167
Хочу показать, как будут выглядеть аналогичные решения рядом в одном масштабе. Промышленный электропривод больше в 5 раз, а гидравлика в 15.
Это и есть ниша между электроприводами и классической гидравликой.
#Итоги акселератора МТК|183
За время акселератора мы перешли от технологии к клиентам.
Посчитали финансовую модель, рынки и вместе с Кама-Ком готовим пилот ЛУЧ-1.
Ожидаемым эффектом будет автоматизация процесса, точность и скорость работы оператора, а главное, безопасность снятия показаний.
#Дорожная карта|200
Первым шагом мы запускаем пилот в начале двадцать седьмого года. А в следующем году планируем начать серийные поставки МСМ и Луч-1.
#Команда|210
Команда проекта состоит из трех человек, с техническим складом компетенций.
Также ищем в команду Директора по развитию.
#Запрос|219
Мы привлекаем 115 миллионов тремя траншами, первый транш в двадцать седьмом году рассчитан на 35 миллионов рублей.
Для пилотов ищем партнеров в сферах робототехники и гидравлических испытаний.
#Финал|231
Мы начинали с кисти, в которую гидравлика не помещалась. Сегодня гидравлическая система с приводом буквально помещается в габариты двух пальцев.
Буду рад ответить на ваши вопросы.`;
